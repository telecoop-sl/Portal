<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TELECOOP SLNE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/logo.png" alt="" onerror="this.remove()"><span>TELECOOP SLNE</span></div>
  <nav aria-label="Sections">
    <button class="on">Database</button>
    <button disabled title="Coming next">Payments</button>
    <button disabled title="Coming next">Overdue</button>
    <button disabled title="Coming next">Dashboard</button>
  </nav>
  <button id="theme" class="ghost" aria-label="Toggle dark mode">Dark mode</button>
</header>
<main>
  <section id="db">
    <div class="bar">
      <input id="q" type="search" placeholder="Search name, account number, PPPoE, phone or address" aria-label="Search customers">
      <select id="fStatus" aria-label="Status"></select>
      <select id="fArea" aria-label="Area"></select>
      <select id="fDue" aria-label="Due Date"></select>
      <select id="fLevel" aria-label="Membership Level"></select>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <p id="meta" class="meta" role="status">Loading…</p>
    <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager"><button id="prev" class="ghost">Previous</button><span id="pg"></span><button id="next" class="ghost">Next</button></div>
  </section>
</main>
<dialog id="detail"></dialog>
<dialog id="keyDlg">
  <form method="dialog" id="keyForm">
    <h2>Enter access key</h2>
    <p class="meta">Saved in this browser only.</p>
    <input id="keyIn" type="password" autocomplete="off" aria-label="Access key">
    <button class="solid">Save key</button>
  </form>
</dialog>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
